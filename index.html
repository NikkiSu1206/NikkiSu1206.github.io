<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="暖暖系列兑换码小站，按游戏与服务器整理，一键复制兑换码。">
  <title>暖暖的礼物小屋</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="images.css">
  <link rel="stylesheet" href="fonts.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="#"><img class="brand-logo" src="nikki_logo.png" alt="" width="40" height="40"> 暖暖的礼物小屋<span class="brand-note">NIKKI GIFT ROOM</span></a><span class="top-note">暖暖的心意，搭配师的惊喜 <span>✦</span></span></header>
  <main>
    <section class="hero">
      <figure class="hero-illustration" tabindex="0" aria-describedby="image-credit">
        <img src="IMG_5644.PNG" alt="身穿黄色花朵礼裙的暖暖" width="1592" height="1978" fetchpriority="high">
        <figcaption id="image-credit" role="tooltip">该素材来源于必胜客 x 无限暖暖联动</figcaption>
      </figure>
      <div class="hero-copy"><p class="eyebrow"><span></span> 给搭配师的礼物清单</p><h1>今天，也有<span>小美好</span><br>等你查收<span class="title-star">✧</span></h1><p class="intro">收集暖暖世界里的每一份惊喜。<br>选好游戏与服务器，把喜欢的礼物带回家。</p><a class="hero-link" href="#collection">查看兑换码 <span>↗</span></a></div>
    </section>
    <section id="collection" aria-label="兑换码合集">
      <div class="collection-title"><div><p class="eyebrow">NIKKI'S CODE COLLECTION</p><h2>暖暖的兑换码手册 <span>✧</span></h2></div><p>选一款游戏，看看暖暖为搭配师准备了什么礼物</p></div>
      <div class="game-tabs" role="tablist" aria-label="选择游戏">
        <button class="game-tab" id="tab-miracle" role="tab" aria-selected="true" aria-controls="game-panel" data-game="miracle"><span class="game-icon"><img src="Love_Nikki_logo.avif" alt="" width="54" height="54"></span><span><strong>奇迹暖暖</strong><small>MIRACLE NIKKI</small></span><span class="tab-arrow">↗</span></button>
        <button class="game-tab" id="tab-shining" role="tab" aria-selected="false" aria-controls="game-panel" tabindex="-1" data-game="shining"><span class="game-icon"><img src="Shining_Nikki_logo.avif" alt="" width="54" height="54"></span><span><strong>闪耀暖暖</strong><small>SHINING NIKKI</small></span><span class="tab-arrow">↗</span></button>
        <button class="game-tab" id="tab-infinity" role="tab" aria-selected="false" aria-controls="game-panel" tabindex="-1" data-game="infinity"><span class="game-icon"><img src="Infinity_Nikki_logo.avif" alt="" width="54" height="54"></span><span><strong>无限暖暖</strong><small>INFINITY NIKKI</small></span><span class="tab-arrow">↗</span></button>
      </div>
      <div id="game-panel" role="tabpanel" aria-labelledby="tab-miracle" aria-busy="true"><div id="servers" class="servers"></div></div>
      <aside class="notice"><span>ⓘ</span><p>兑换前，请确认游戏与服务器。已过期的兑换码会自动隐藏；未填写到期日的兑换码以游戏内实际结果为准。</p></aside>
    </section>
    <footer><span>暖暖的礼物小屋</span><p>本页面为<a href="https://nikki.su">暖暖小屋</a>分支项目，仅当前页面托管于Github Page</p><small>非官方整理 · 兑换结果以游戏内为准</small></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
